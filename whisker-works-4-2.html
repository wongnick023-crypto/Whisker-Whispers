      span.textContent = formatDps(val) + suffix;
    });
  }

  function bindCompareEvents(wrap){
    wrap.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.remove;
      compareIds = compareIds.filter(x => x !== id);
      updateCompareTabBadge();
      renderCompare();
      renderList();
    }));
    wrap.querySelectorAll('.form-pill').forEach(b => b.addEventListener('click', () => {
      compareFormIdx[b.dataset.id] = Number(b.dataset.idx);
      renderCompare();
    }));
    wrap.querySelectorAll('[data-level]').forEach(inp => inp.addEventListener('input', () => {
      const id = inp.dataset.level;
      const level = Math.max(1, Number(inp.value) || 1);
      compareLevel[id] = level;
      recomputeLevelCells(wrap, id, level);
    }));
  }

  function openComparePickerModal(){
    const rows = indexCache.map(c => {
      const checked = compareIds.includes(c.id) ? 'checked' : '';
      return '<label class="picker-row"><input type="checkbox" data-pick="' + c.id + '" ' + checked + '> ' + esc(c.name) + ' <span class="tiny-tag">' + esc(RARITY_MAP[c.rarity].label) + '</span></label>';
    }).join('') || '<p>No cats yet — create one first!</p>';

    const refresh = () => { renderCompare(); renderList(); };

    openModal({
      title: 'Choose cats to compare',
      body: '<div class="picker-list">' + rows + '</div>',
      confirmLabel: 'Done',
      cancelLabel: 'Close',
      onConfirm: refresh,
      onCancel: refresh
    });

    document.querySelectorAll('[data-pick]').forEach(cb => cb.addEventListener('change', () => {
      const id = cb.dataset.pick;
      if (cb.checked){
        if (!compareIds.includes(id)) compareIds.push(id);
        if (compareFormIdx[id] === undefined) compareFormIdx[id] = 0;
      } else {
        compareIds = compareIds.filter(x => x !== id);
      }
      updateCompareTabBadge();
    }));
  }

  /* ============================= Editor ============================= */

  async function openEditor(id){
    showView('edit');
    document.getElementById('formPanels').innerHTML = '<div class="loading-msg">Loading…</div>';
    if (id){
      editingIsNew = false;
      const cat = await fetchCatFull(id);
      if (!cat){ showToast('Could not load that cat.', 'error'); showView('list'); return; }
      workingCat = JSON.parse(JSON.stringify(cat));
      workingCat.bannerId = workingCat.bannerId || MY_BANNER_ID;
    } else {
      editingIsNew = true;
      workingCat = blankCat();
    }
    activeFormIndex = 0;
    renderEditor();
  }

  function renderEditor(){
    document.getElementById('editTitle').textContent = editingIsNew ? 'New Cat' : ('Edit ' + (workingCat.name || 'Cat'));
    document.getElementById('deleteCatBtn').hidden = editingIsNew;
    renderRarityPicker();
    renderBannerPicker();
    renderFormCountPicker();
    renderFormTabsAndPanels();
  }

  function renderBannerPicker(){
    const el = document.getElementById('bannerPicker');
    const current = workingCat.bannerId || MY_BANNER_ID;
    el.innerHTML = bannersCache.map(b =>
      '<button type="button" class="banner-opt ' + (current === b.id ? 'active' : '') + '" data-banner="' + b.id + '">' + esc(b.name) + '</button>'
    ).join('') + '<button type="button" class="banner-opt add-new" id="addBannerFromEditorBtn">+ New</button>';
    el.querySelectorAll('button[data-banner]').forEach(b => b.addEventListener('click', () => {
      workingCat.bannerId = b.dataset.banner;
      renderBannerPicker();
    }));
    const addBtn = el.querySelector('#addBannerFromEditorBtn');
    if (addBtn) addBtn.addEventListener('click', () => openCreateBannerModal(id => {
      workingCat.bannerId = id;
      renderBannerPicker();
      renderBannerFilterSelect();
    }));
  }

  function renderRarityPicker(){
    const el = document.getElementById('rarityPicker');
    el.innerHTML = RARITIES.map(r =>
      '<button type="button" class="rarity-opt ' + (workingCat.rarity === r.key ? 'active' : '') + '" data-rarity="' + r.key + '" style="background:' + (r.gradient || r.color) + '">' + esc(r.label) + '</button>'
    ).join('');
    el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      workingCat.rarity = b.dataset.rarity;
      renderRarityPicker();
    }));
  }

  function renderFormCountPicker(){
    const el = document.getElementById('formCountPicker');
    el.innerHTML = [1, 2, 3, 4].map(n => {
      const fc = FORM_COLORS[n - 1] || FORM_COLORS[0];
      const namesUpTo = [];
      for (let i = 0; i < n; i++) namesUpTo.push(formLabelAt(workingCat, i));
      const style = 'style="--form-color:' + fc.bg + '; --form-text:' + fc.text + '; --form-border:' + fc.border + '"';
      return '<button type="button" class="count-opt ' + (workingCat.formCount === n ? 'active' : '') + '" data-count="' + n + '" ' + style + ' title="' + esc(namesUpTo.join(' / ')) + '">' + esc(formLabelAt(workingCat, n - 1)) + '</button>';
    }).join('');
    el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => setFormCount(Number(b.dataset.count))));
  }

  function setFormCount(n){
    if (n === workingCat.formCount) return;
    if (n < workingCat.formCount){
      const removed = workingCat.forms.slice(n);
      const hasData = removed.some(formHasData);
      const doShrink = () => {
        workingCat.forms = workingCat.forms.slice(0, n);
        workingCat.formCount = n;
        if (activeFormIndex >= n) activeFormIndex = n - 1;
        renderFormCountPicker();
        renderFormTabsAndPanels();
      };
      if (hasData){
        openModal({
          title: 'Remove form data?',
          body: '<p>Reducing to ' + n + ' form' + (n > 1 ? 's' : '') + ' will delete the data you entered for ' + removed.map((_, idx) => formLabelAt(workingCat, n + idx)).join(', ') + '.</p>',
          confirmLabel: 'Remove',
          danger: true,
          onConfirm: doShrink,
          onCancel: () => { renderFormCountPicker(); }
        });
      } else {
        doShrink();
      }
    } else {
      while (workingCat.forms.length < n) workingCat.forms.push(blankForm(workingCat.forms.length));
      workingCat.formCount = n;
      renderFormCountPicker();
      renderFormTabsAndPanels();
    }
  }

  function renderFormTabsAndPanels(){
    const tabsEl = document.getElementById('formTabs');
    tabsEl.innerHTML = workingCat.forms.map((f, i) => {
      const fc = FORM_COLORS[i] || FORM_COLORS[0];
      const style = 'style="--form-color:' + fc.bg + '; --form-text:' + fc.text + '; --form-border:' + fc.border + '"';
      return '<button type="button" class="form-tab ' + (i === activeFormIndex ? 'active' : '') + '" data-idx="' + i + '" ' + style + '>' + esc(formLabelAt(workingCat, i)) + '</button>';
    }).join('');
    tabsEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      activeFormIndex = Number(b.dataset.idx);
      renderFormTabsAndPanels();
    }));

    const panelsEl = document.getElementById('formPanels');
    const f = workingCat.forms[activeFormIndex];
    panelsEl.innerHTML = formPanelHtml(f);
    bindFormPanelEvents(panelsEl, f);
  }

  // The preview level for a form defaults to its form slot's default (Normal=1, Evolved=10,
  // True=30, Ultra=60) but can be overridden per-form via the editable Lvl field.
  function formPreviewLevel(f){
    const custom = f && f.previewLevel;
    if (custom !== null && custom !== undefined && custom !== '') return Math.max(1, Number(custom) || 1);
    return formBaseLevel(f, activeFormIndex);
  }

  function currentPreviewLevel(f){
    return levelPreviewOn ? formPreviewLevel(f) : formBaseLevel(f, activeFormIndex);
  }

  function dpsFieldHtml(f){
    const cycle = attackCycleOf(f);
    const qualifies = isEffectiveQualified(f);
    const level = currentPreviewLevel(f);
    let display = '—';
    if (cycle > 0){
      let val = apAtLevel(f, activeFormIndex, level) / cycle;
      let suffix = '';
      if (effectivePreviewOn && qualifies){ val *= bestDealtMultiplier(f); suffix = '*'; }
      display = formatDps(val) + suffix;
    }
    return '<div class="stat-field stat-computed"><span>DPS<span class="auto-badge">auto</span></span>' +
      '<div class="computed-value" id="dpsComputedValue">' + display + '</div></div>';
  }

  // Trait effect entries carry a `traits` array (an effect can now target several traits at
  // once, e.g. Strong Against Red + Floating), rather than a single `trait`. This joins them
  // into a readable, comma-separated label.
  function traitsLabelOf(e){
    const arr = Array.isArray(e && e.traits) ? e.traits : (e && e.trait ? [e.trait] : []);
    if (!arr.length) return '—';
    return arr.map(t => (TRAIT_MAP[t] || {}).label || t).join(', ');
  }

  function effectiveHintText(f){
    const effects = (f && f.traitEffects) || [];
    const offense = effects.filter(e => (TRAIT_ABILITY_MAP[e.ability] || {}).kind === 'offense');
    const defense = effects.filter(e => (TRAIT_ABILITY_MAP[e.ability] || {}).kind === 'defense');
    const parts = [];
    if (offense.length){
      const descs = offense.map(e => {
        const type = TRAIT_ABILITY_MAP[e.ability] || {};
        const traitLabel = esc(traitsLabelOf(e));
        const mult = dealtMultiplierOf(e);
        const takenNote = e.ability === 'strong_against' ? (', ' + EFFECTIVE_TAKEN_MULT + 'x taken') : '';
        return esc(type.label || e.ability) + ' vs ' + traitLabel + ' (' + mult.toFixed(2) + 'x dealt' + takenNote + ')';
      });
      parts.push('Damage dealt: ' + descs.join('; ') + '. The DPS preview above uses the strongest one.');
    }
    if (defense.length){
      const descs = defense.map(e => {
        const type = TRAIT_ABILITY_MAP[e.ability] || {};
        const traitLabel = esc(traitsLabelOf(e));
        const taken = Number(e.value);
        return esc(type.label || e.ability) + ' vs ' + traitLabel + ' (takes ' + (taken || taken === 0 ? taken : '?') + 'x damage)';
      });
      parts.push('Damage taken: ' + descs.join('; ') + '.');
    }
    if (!parts.length) return 'Add a Strong Against, Massive Damage, or Insane Damage trait effect below to preview the DPS bonus.';
    return '* ' + parts.join(' ');
  }

  function levelPreviewHintText(f){
    const level = formPreviewLevel(f);
    const base = formBaseLevel(f, activeFormIndex);
    const formName = FORM_LABELS[activeFormIndex] || ('Form ' + (activeFormIndex + 1));
    const isCustom = f && f.previewLevel !== null && f.previewLevel !== undefined && f.previewLevel !== '';
    const isCustomBase = f && f.baseLevel !== null && f.baseLevel !== undefined && f.baseLevel !== '';
    return '* Showing HP, Damage and DPS at Level ' + level + (isCustom ? ' — set for this ' + esc(formName) + ' form' : ' — the default preview level for ' + esc(formName) + ' forms') +
      '. The stats you entered above are treated as this form\'s Level ' + base + ' stats' + (isCustomBase ? ' (custom base level)' : ' (default base level for ' + esc(formName) + ' forms)') +
      ', using this form\'s own level-up growth below (each form can grow at a different rate). Change the Lvl field above to preview a different level, or set a different base level in the growth box below.';
  }

  // Controls for telling Whisker Works which level the stats typed into this form actually
  // are. Normal forms usually exist from Level 1, but Evolved/True/Ultra forms only unlock
  // partway through — so stats copied from the wiki (or from in-game) for those forms are
  // already Level 10/30/60 stats, not Level 1. Getting this wrong is what made growth blow up
  // the numbers, so it's editable per form here.
  function baseLevelRowHtml(f, idx){
    const current = formBaseLevel(f, idx);
    const isCustom = f && f.baseLevel !== null && f.baseLevel !== undefined && f.baseLevel !== '';
    const defaultLvl = FORM_LEVELS[idx] || 1;
    const formName = FORM_LABELS[idx] || ('Form ' + (idx + 1));
    const note = isCustom
      ? ('Custom base level. The default for ' + esc(formName) + ' forms is Level ' + defaultLvl + '.')
      : ('Default base level for ' + esc(formName) + ' forms.');
    return '<div class="base-level-row">' +
      '<label class="stat-field base-level-field"><span>Stats above are this form\'s Level</span>' +
        '<input type="number" min="1" max="9999" id="baseLevelInput" value="' + current + '"></label>' +
      '<button type="button" class="btn small" id="setBaseLevelBtn" title="Use the number to the left as this form\'s base level">Set as base level</button>' +
      (isCustom ? '<button type="button" class="btn small ghost" id="resetBaseLevelBtn" title="Go back to Level ' + defaultLvl + '">Reset to default</button>' : '') +
      '<span class="base-level-note">' + note + '</span>' +
    '</div>';
  }

  function effectivePreviewText(key, f, value){
    if (key === 'ap'){
      if (!isEffectiveQualified(f)) return '';
      const mult = bestDealtMultiplier(f);
      return 'Effective dmg: ' + formatNum(Math.round(value * mult)) + '*';
    }
    if (key === 'hp'){
      const mult = bestTakenMultiplier(f);
      if (mult === null) return '';
      return 'Effective HP: ' + formatNum(Math.round(value / mult)) + '*';
    }
    return '';
  }

  // Attack Range gets its own renderer: the standard range box, then Target Type (Single
  // Target / Area Attack) and Range Modifier (None / Omni Strike / Long Distance) as two
  // independent selectors, then whichever extra boxes the chosen Range Modifier calls for
  // (Omni Strike's negative-only behind-range box, or Long Distance's Blindspot + Standing
  // Range boxes). Nothing extra is shown when the Range Modifier is None.
  function rangeFieldHtml(f){
    const rangeInput = '<label class="stat-field"><span>Attack Range</span>' +
      '<input type="number" step="any" data-stat="range" value="' + (f.stats.range === undefined ? '' : f.stats.range) + '" placeholder="0"></label>';

    const targetOptions = TARGET_TYPES.map(t =>
      '<option value="' + t.key + '"' + (f.targetType === t.key ? ' selected' : '') + '>' + esc(t.label) + '</option>'
    ).join('');
    const targetSelect = '<label class="stat-field"><span>Target Type</span>' +
      '<select id="targetTypeSelect">' + targetOptions + '</select></label>';

    const modifierOptions = RANGE_MODIFIERS.map(t =>
      '<option value="' + t.key + '"' + (f.rangeModifier === t.key ? ' selected' : '') + '>' + esc(t.label) + '</option>'
    ).join('');
    const modifierSelect = '<label class="stat-field"><span>Range Modifier</span>' +
      '<select id="rangeModifierSelect">' + modifierOptions + '</select></label>';

    let extra = '';
    if (f.rangeModifier === 'omni'){
      extra = '<label class="stat-field"><span>Omni Strike Range (behind)</span>' +
        '<input type="number" step="1" max="-1" data-stat="rangeOmni" value="' + (f.stats.rangeOmni === undefined ? '' : f.stats.rangeOmni) + '" placeholder="-100" title="Omni Strike hits behind the cat too — enter a negative value."></label>';
    } else if (f.rangeModifier === 'longdistance'){
      extra = '<label class="stat-field"><span>Blindspot</span>' +
        '<input type="number" step="1" data-stat="rangeBlindspot" value="' + (f.stats.rangeBlindspot === undefined ? '' : f.stats.rangeBlindspot) + '" placeholder="0"></label>' +
        '<label class="stat-field"><span>Standing Range</span>' +
        '<input type="number" step="1" data-stat="rangeStandingRange" value="' + (f.stats.rangeStandingRange === undefined ? '' : f.stats.rangeStandingRange) + '" placeholder="0"></label>';
    }

    return rangeInput + targetSelect + modifierSelect + extra;
  }

  function statFieldHtml(sf, f){
    if (sf.computed) return dpsFieldHtml(f);
    if (sf.key === 'range') return rangeFieldHtml(f);
    const isLevelable = (sf.key === 'hp' || sf.key === 'ap');
    let preview = '';
    let valueForEffective = Number(f.stats[sf.key]) || 0;
    if (levelPreviewOn && isLevelable){
      const level = formPreviewLevel(f);
      const baseLevel = formBaseLevel(f, activeFormIndex);
      const growth = Number(sf.key === 'hp' ? f.hpGrowth : f.dmgGrowth) || 0;
      const base = Number(f.stats[sf.key]) || 0;
      const atLevel = base + growth * (level - baseLevel);
      valueForEffective = atLevel;
      preview = '<small class="level-preview-value" data-level-preview="' + sf.key + '">@ Lvl ' + level + ': ' + formatNum(Math.round(atLevel)) + '</small>';
    }
    let effectiveHtml = '';
    if (isLevelable){
      const text = effectivePreviewText(sf.key, f, valueForEffective);
      effectiveHtml = '<small class="effective-preview-value" data-effective-preview="' + sf.key + '"' + (effectivePreviewOn && text ? '' : ' hidden') + '>' + text + '</small>';
    }
    return '<label class="stat-field"><span>' + esc(sf.label) + '</span>' +
      '<input type="number" step="any" data-stat="' + sf.key + '" value="' + (f.stats[sf.key] === undefined ? '' : f.stats[sf.key]) + '" placeholder="0">' +
      preview + effectiveHtml +
    '</label>';
  }

  // ---- Generic "ability entry" picker: add/chip/remove UI shared by Neutral Abilities and
  // the Conjured Cat's own abilities. Entries are objects like { key, ...fieldValues } so
  // abilities with extra fields (Strengthen, Survive, Critical, etc.) can carry their values,
  // while fieldless abilities are just { key }. ----

  function abilityEntrySelectOptionsHtml(chosenKeys, excludeKeys){
    const excluded = new Set([].concat(excludeKeys || [], chosenKeys || []));
    const available = NEUTRAL_ABILITIES.filter(a => !excluded.has(a.key));
    if (!available.length) return '<option value="">All abilities added</option>';
    return '<option value="">Select an ability…</option>' + available.map(a =>
      '<option value="' + a.key + '">' + esc(a.label) + '</option>'
    ).join('');
  }

  // Extra value-fields markup for a chosen ability: the generic numeric fields (Chance,
  // Strengthens by, etc.) plus, for Survive specifically, the Limited/Infinite toggle and its
  // follow-up boxes.
  function abilityEntryValueFieldsHtml(key){
    const type = NEUTRAL_ABILITY_MAP[key];
    if (!type) return '';
    let html = traitValueFieldsHtml(type);
    if (key === 'survive'){
      html +=
        '<label class="stat-field" data-field-key="surviveMode"><span>Survives</span>' +
          '<select id="surviveModeSelect"><option value="count">Limited number of times</option><option value="infinite">Infinite</option></select>' +
        '</label>' +
        '<label class="stat-field" id="surviveCountField"><span>Number of times</span><input type="number" min="1" step="1" id="surviveCountInput" placeholder="1"></label>' +
        '<label class="stat-field" id="surviveDecayField" hidden><span>Chance decrease / survive (%)</span><input type="number" min="0" step="1" id="surviveDecayInput" placeholder="0"></label>' +
        '<label class="stat-field" id="surviveMinField" hidden><span>Minimum chance (%)</span><input type="number" min="0" max="100" step="1" id="surviveMinInput" placeholder="0"></label>';
    }
    return html;
  }

  function bindSurviveModeToggle(container){
    const modeSel = container.querySelector('#surviveModeSelect');
    if (!modeSel) return;
    const countField = container.querySelector('#surviveCountField');
    const decayField = container.querySelector('#surviveDecayField');
    const minField = container.querySelector('#surviveMinField');
    function sync(){
      const infinite = modeSel.value === 'infinite';
      if (countField) countField.hidden = infinite;
      if (decayField) decayField.hidden = !infinite;
      if (minField) minField.hidden = !infinite;
    }
    modeSel.addEventListener('change', sync);
    sync();
  }

  function abilityEntryLabel(e){
    const type = NEUTRAL_ABILITY_MAP[e.key] || {};
    const fields = type.fields || [];
    const parts = fields
      .filter(fld => e[fld.key] !== undefined && e[fld.key] !== null && e[fld.key] !== '')
      .map(fld => e[fld.key] + (fld.suffix || ''));
    if (e.key === 'survive'){
      if (e.infinite){
        parts.push('∞ survives');
        if (e.decay !== undefined && e.decay !== null && e.decay !== '') parts.push('-' + e.decay + '%/ea');
        if (e.minChance !== undefined && e.minChance !== null && e.minChance !== '') parts.push('min ' + e.minChance + '%');
      } else if (e.count !== undefined && e.count !== null && e.count !== ''){
        parts.push(e.count + 'x');
      }
    }
    return parts.length ? (type.label || e.key) + ' (' + parts.join(', ') + ')' : (type.label || e.key);
  }

  function abilityEntryListInnerHtml(list, removeAttr){
    if (!list.length) return '<p class="ability-empty">No abilities added yet.</p>';
    return '<div class="ability-chip-list">' + list.map((e, idx) =>
      '<span class="ability-chip">' + esc(abilityEntryLabel(e)) +
        '<button type="button" data-' + removeAttr + '="' + idx + '" title="Remove ability">×</button></span>'
    ).join('') + '</div>';
  }

  // Factory shared by the main Neutral Abilities box and the Conjured Cat's ability box.
  // `getList(f)` returns the array to read/mutate; `excludeKeys` hides options that shouldn't
  // be pickable there (e.g. Conjure can't conjure another Conjure). `onChange`, if given, runs
  // after every add/remove (used to refresh the Conjure section when Conjure itself is toggled).
  function makeAbilityEntryController(getList, ids, excludeKeys, onChange){
    function render(f, root){
      root = root || document;
      const selectEl = root.querySelector('#' + ids.select);
      if (selectEl) selectEl.innerHTML = abilityEntrySelectOptionsHtml(getList(f).map(e => e.key), excludeKeys);
      const valueFieldsEl = root.querySelector('#' + ids.valueFields);
      if (valueFieldsEl) valueFieldsEl.innerHTML = '';
      const listEl = root.querySelector('#' + ids.list);
      if (listEl) listEl.innerHTML = abilityEntryListInnerHtml(getList(f), ids.removeAttr);
      bind(f, root);
    }
    function bind(f, root){
      const selectEl = root.querySelector('#' + ids.select);
      const valueFieldsEl = root.querySelector('#' + ids.valueFields);
      const addBtn = root.querySelector('#' + ids.addBtn);
      const listEl = root.querySelector('#' + ids.list);

      function syncValueFields(){
        if (!valueFieldsEl || !selectEl) return;
        valueFieldsEl.innerHTML = abilityEntryValueFieldsHtml(selectEl.value);
        bindSurviveModeToggle(valueFieldsEl);
      }
      if (selectEl) selectEl.addEventListener('change', syncValueFields);

      if (addBtn && selectEl) addBtn.addEventListener('click', () => {
        const key = selectEl.value;
        if (!key) return;
        const type = NEUTRAL_ABILITY_MAP[key] || {};
        const entry = { key };
        (type.fields || []).forEach(fld => {
          const inp = valueFieldsEl ? valueFieldsEl.querySelector('[data-field-input="' + fld.key + '"]') : null;
          const raw = inp ? inp.value : '';
          const num = Number(raw);
          entry[fld.key] = (raw !== '' && !isNaN(num)) ? num : fld.default;
        });
        if (key === 'survive' && valueFieldsEl){
          const modeSel = valueFieldsEl.querySelector('#surviveModeSelect');
          const infinite = modeSel ? modeSel.value === 'infinite' : false;
          entry.infinite = infinite;
          if (infinite){
            const decayInp = valueFieldsEl.querySelector('#surviveDecayInput');
            const minInp = valueFieldsEl.querySelector('#surviveMinInput');
            entry.decay = (decayInp && decayInp.value !== '') ? Number(decayInp.value) : 0;
            entry.minChance = (minInp && minInp.value !== '') ? Number(minInp.value) : 0;
          } else {
            const countInp = valueFieldsEl.querySelector('#surviveCountInput');
            entry.count = (countInp && countInp.value !== '') ? Number(countInp.value) : 1;
          }
        }
        getList(f).push(entry);
        render(f, root);
        if (onChange) onChange(f);
      });

      if (listEl) listEl.querySelectorAll('[data-' + ids.removeAttr + ']').forEach(btn => {
        btn.addEventListener('click', () => {
          getList(f).splice(Number(btn.dataset[ids.removeDatasetKey]), 1);
          render(f, root);
          if (onChange) onChange(f);
        });
      });

      syncValueFields();
    }
    return { render };
  }

  const neutralAbilityController = makeAbilityEntryController(
    f => f.abilities,
    { select:'neutralAbilitySelect', valueFields:'neutralAbilityValueFields', addBtn:'addAbilityBtn', list:'abilityList', removeAttr:'ability-remove', removeDatasetKey:'abilityRemove' },
    [],
    f => refreshConjureSection(f)
  );

  function renderAbilityBox(f, root){
    neutralAbilityController.render(f, root || document);
  }

  // ---- Immunity: separate, fieldless box (Immune to Freeze, Slow, Weaken, etc). ----

  function immunitySelectOptionsHtml(chosen){
    const available = IMMUNITY_ABILITIES.filter(a => !chosen.includes(a.key));
    if (!available.length) return '<option value="">All immunities added</option>';
    return '<option value="">Select an immunity…</option>' + available.map(a =>
      '<option value="' + a.key + '">' + esc(a.label) + '</option>'
    ).join('');
  }

  function immunityListInnerHtml(f){
    const list = f.immunities || [];
    if (!list.length) return '<p class="ability-empty">No immunities added yet.</p>';
    return '<div class="ability-chip-list">' + list.map((key, idx) =>
      '<span class="ability-chip">' + esc(immunityLabel(key)) +
        '<button type="button" data-immunity-remove="' + idx + '" title="Remove immunity">×</button></span>'
    ).join('') + '</div>';
  }

  function renderImmunityBox(f, root){
    root = root || document;
    const selectEl = root.querySelector('#immunitySelect');
    if (selectEl) selectEl.innerHTML = immunitySelectOptionsHtml(f.immunities || []);
    const listEl = root.querySelector('#immunityList');
    if (listEl){
      listEl.innerHTML = immunityListInnerHtml(f);
      bindImmunityListEvents(listEl, f);
    }
  }

  function bindImmunityListEvents(listEl, f){
    listEl.querySelectorAll('[data-immunity-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        f.immunities.splice(Number(btn.dataset.immunityRemove), 1);
        renderImmunityBox(f);
      });
    });
  }

  // ---- Conjure: when a form has the Conjure ability, it can summon a "little cat" of its
  // own — a separate mini-unit with its own damage and its own set of neutral abilities. ----

  function hasConjure(f){
    return (f.abilities || []).some(e => e.key === 'conjure');
  }

  const conjureAbilityController = makeAbilityEntryController(
    f => f.conjure.abilities,
    { select:'conjureAbilitySelect', valueFields:'conjureAbilityValueFields', addBtn:'addConjureAbilityBtn', list:'conjureAbilityList', removeAttr:'conjure-ability-remove', removeDatasetKey:'conjureAbilityRemove' },
    ['conjure']
  );

  function conjureSectionHtml(f){
    if (!hasConjure(f)) return '';
    const c = f.conjure || { name:'', damage:'', abilities:[] };
    return '<div class="trait-box ability-box">' +
        '<p class="trait-box-title">🐱 Conjured Cat</p>' +
        '<p class="trait-box-hint">Conjure summons a little cat of its own — give it a name, damage, and abilities.</p>' +
        '<div class="trait-box-row">' +
          '<label class="text-field"><span>Name</span><input type="text" class="input" id="conjureNameInput" value="' + esc(c.name || '') + '" placeholder="e.g. Lil\' Nyandam"></label>' +
          '<label class="stat-field"><span>Damage</span><input type="number" step="any" id="conjureDamageInput" value="' + (c.damage === undefined || c.damage === null ? '' : c.damage) + '" placeholder="0"></label>' +
        '</div>' +
        '<div class="trait-box-row">' +
          '<label class="stat-field"><span>Add Ability</span><select id="conjureAbilitySelect">' + abilityEntrySelectOptionsHtml(c.abilities.map(e => e.key), ['conjure']) + '</select></label>' +
          '<div class="trait-value-fields" id="conjureAbilityValueFields"></div>' +
          '<button type="button" class="btn small" id="addConjureAbilityBtn">+ Add Ability</button>' +
        '</div>' +
        '<div class="ability-list" id="conjureAbilityList">' + abilityEntryListInnerHtml(c.abilities, 'conjure-ability-remove') + '</div>' +
      '</div>';
  }

  function bindConjureSectionEvents(wrapEl, f){
    if (!wrapEl) return;
    const nameInp = wrapEl.querySelector('#conjureNameInput');
    if (nameInp) nameInp.addEventListener('input', () => { f.conjure.name = nameInp.value; });

    const dmgInp = wrapEl.querySelector('#conjureDamageInput');
    if (dmgInp) dmgInp.addEventListener('input', () => { f.conjure.damage = dmgInp.value; });

    conjureAbilityController.render(f, wrapEl);
  }

  // Re-renders the Conjure section in place (it only exists while the Conjure ability is
  // active on the form) without re-rendering the whole form panel.
  function refreshConjureSection(f){
    const wrap = document.getElementById('conjureWrap');
    if (!wrap) return;
    wrap.innerHTML = conjureSectionHtml(f);
    bindConjureSectionEvents(wrap, f);
  }

  // ---- Trait effects (Strong Against, Resistant, Weaken, etc.) — ability + trait, same
  // add/chip/remove pattern as Neutral Abilities ----

  function traitAbilityOptionsHtml(){
    return '<option value="">Select an ability…</option>' + TRAIT_ABILITIES.map(a =>
      '<option value="' + a.key + '" title="' + esc(a.desc) + '">' + esc(a.label) + '</option>'
    ).join('');
  }

  // Renders one small numeric input per `fields` entry on the selected ability (e.g. Weaken
  // gets Chance / Weakens power by / Duration; Massive Damage just gets a single value box).
  // Abilities with no fields (Strong Against, Attacks Only) render nothing here.
  function traitValueFieldsHtml(type){
    const fields = (type && type.fields) || [];
    return fields.map(fld =>
      '<label class="stat-field" data-field-key="' + fld.key + '"><span>' + esc(fld.label) + '</span>' +
        '<input type="number" step="' + (fld.step || 'any') + '"' +
        (fld.min !== undefined ? ' min="' + fld.min + '"' : '') +
        (fld.max !== undefined ? ' max="' + fld.max + '"' : '') +
        ' data-field-input="' + fld.key + '" placeholder="' + fld.default + '"></label>'
    ).join('');
  }

  function traitSelectOptionsHtml(){
    return TRAITS.map(t =>
      '<option value="' + t.key + '">' + esc(t.label) + '</option>'
    ).join('');
  }

  function traitEffectLabel(e){
    const type = TRAIT_ABILITY_MAP[e.ability] || {};
    const abilityLabel = type.label || e.ability;
    const traitLabel = traitsLabelOf(e);
    let label = e.ability === 'strong_against' ? (abilityLabel + ' ' + traitLabel) : (abilityLabel + ' vs ' + traitLabel);
    const fields = type.fields || [];
    if (fields.length){
      const parts = fields
        .filter(fld => e[fld.key] !== undefined && e[fld.key] !== null && e[fld.key] !== '')
        .map(fld => e[fld.key] + (fld.suffix || ''));
      if (parts.length) label += ' (' + parts.join(', ') + ')';
    }
    return label;
  }

  function traitListInnerHtml(f){
    const list = f.traitEffects || [];
    if (!list.length) return '<p class="ability-empty">No trait effects added yet.</p>';
    return '<div class="ability-chip-list">' + list.map((e, idx) =>
      '<span class="ability-chip" title="' + esc((TRAIT_ABILITY_MAP[e.ability] || {}).desc || '') + '">' + esc(traitEffectLabel(e)) +
        '<button type="button" data-trait-remove="' + idx + '" title="Remove trait effect">×</button></span>'
    ).join('') + '</div>';
  }

  function renderTraitBox(f){
    const listEl = document.getElementById('traitList');
    if (listEl){
      listEl.innerHTML = traitListInnerHtml(f);
      bindTraitListEvents(listEl, f);
    }
    updateEffectiveHint(f);
    updateDpsDisplay(f);
    updateEffectivePreviews(f);
  }

  function bindTraitListEvents(listEl, f){
    listEl.querySelectorAll('[data-trait-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        f.traitEffects.splice(Number(btn.dataset.traitRemove), 1);
        renderTraitBox(f);
      });
    });
  }

  // ---- Evolve Requirements: materials (+ variant + amount) needed to evolve INTO a form.
  // Not shown for the Normal form (index 0) since nothing evolves into it. ----

  function materialSelectOptionsHtml(){
    const groups = {};
    MATERIALS.forEach(m => { (groups[m.group] = groups[m.group] || []).push(m); });
    let html = '<option value="">Select a material…</option>';
    Object.keys(groups).forEach(g => {
      html += '<optgroup label="' + esc(g) + '">' + groups[g].map(m =>
        '<option value="' + m.key + '">' + esc(m.color) + '</option>'
      ).join('') + '</optgroup>';
    });
    return html;
  }

  function materialVariantOptionsHtml(materialKey){
    const m = MATERIAL_MAP[materialKey];
    if (!m) return '<option value="">—</option>';
    return m.variants.map(v => '<option value="' + v.key + '">' + esc(v.label) + '</option>').join('');
  }

  function materialEntryLabel(e){
    const m = MATERIAL_MAP[e.key];
    if (!m) return e.key;
    const variantObj = m.variants.find(v => v.key === e.variant) || m.variants[0];
    const amt = (e.amount === undefined || e.amount === null || e.amount === '') ? 0 : Number(e.amount);
    return m.color + ' ' + variantObj.label + ' ×' + amt;
  }

  function materialListInnerHtml(list){
    if (!list || !list.length) return '<p class="ability-empty">No materials added yet.</p>';
    return '<div class="ability-chip-list">' + list.map((e, idx) =>
      '<span class="ability-chip">' + esc(materialEntryLabel(e)) +
        '<button type="button" data-material-remove="' + idx + '" title="Remove material">×</button></span>'
    ).join('') + '</div>';
  }

  // The level required to evolve into this form: a custom override (f.evolveReq.level) if the
  // user set one, otherwise the form slot's default (Evolved → 10, True → 30). Ultra has no
  // default — it stays null unless the user sets one — since Ultra always needs materials
  // regardless of level.
  function evolveReqLevel(f, idx){
    const custom = f && f.evolveReq && f.evolveReq.level;
    if (custom !== null && custom !== undefined && custom !== '') return Math.max(1, Number(custom) || 1);
    return EVOLVE_DEFAULT_LEVEL[idx] || null;
  }

  function evolveReqSectionHtml(f, idx){
    if (idx === 0) return ''; // Normal form has nothing to evolve from
    const req = f.evolveReq || { materials: [], xp: '', level: '' };
    const materials = req.materials || [];
    const fromLabel = formLabelAt(workingCat, idx - 1);
    const toLabel = formLabelAt(workingCat, idx);
    const defaultLevel = EVOLVE_DEFAULT_LEVEL[idx] || null;
    const level = evolveReqLevel(f, idx);
    const isCustomLevel = req.level !== null && req.level !== undefined && req.level !== '';
    const levelPhrase = level ? ('reaching Level ' + level) : null;

    let hint;
    if (idx === 3){
      hint = materials.length
        ? ('These materials' + (levelPhrase ? ' (and ' + levelPhrase + ')' : '') + ' are required to evolve ' + esc(fromLabel) + ' into ' + esc(toLabel) + '.')
        : ('⚠ Ultra Forms always need at least one evolve material — this form can\u2019t be saved until one is added.' + (levelPhrase ? (' Also requires ' + levelPhrase + '.') : ''));
    } else if (materials.length){
      hint = 'These materials' + (levelPhrase ? ' (and ' + levelPhrase + ')' : '') + ' are required to evolve ' + esc(fromLabel) + ' into ' + esc(toLabel) + '.';
    } else if (levelPhrase){
      hint = 'No materials added — defaults to simply "Reach Level ' + level + '" with no items needed.';
    } else {
      hint = 'No materials or level requirement set for this form.';
    }

    const xpField = materials.length
      ? '<label class="stat-field"><span>XP to Evolve</span><input type="number" min="0" step="1" id="evolveXpInput" value="' + (req.xp === undefined || req.xp === null ? '' : req.xp) + '" placeholder="0"></label>'
      : '';

    const levelField = '<label class="stat-field"><span>Level Required' + (isCustomLevel ? '' : (defaultLevel ? ' (default)' : '')) + '</span>' +
      '<input type="number" min="1" max="9999" id="evolveLevelInput" value="' + (isCustomLevel ? level : '') + '" placeholder="' + (defaultLevel || 'None') + '" title="Leave blank to use the default for this form (Evolved: 10, True: 30). Ultra has no default."></label>';

    return '<div class="text-field">' +
        '<div class="trait-box ability-box">' +
          '<p class="trait-box-title">🧬 Evolve Requirements (' + esc(fromLabel) + ' → ' + esc(toLabel) + ')</p>' +
          '<div class="trait-box-row">' +
            levelField +
            '<label class="stat-field"><span>Material</span><select id="evolveMaterialSelect">' + materialSelectOptionsHtml() + '</select></label>' +
            '<label class="stat-field"><span>Variant</span><select id="evolveVariantSelect"><option value="">—</option></select></label>' +
            '<label class="stat-field"><span>Amount</span><input type="number" min="1" step="1" id="evolveAmountInput" placeholder="1"></label>' +
            '<button type="button" class="btn small" id="addEvolveMaterialBtn">+ Add Material</button>' +
            xpField +
          '</div>' +
          '<div class="ability-list" id="evolveMaterialList">' + materialListInnerHtml(materials) + '</div>' +
          '<p class="trait-box-hint">' + hint + '</p>' +
        '</div>' +
      '</div>';
  }

  function bindEvolveReqSectionEvents(panelsEl, f, idx){
    if (idx === 0) return;
    const materialSelect = panelsEl.querySelector('#evolveMaterialSelect');
    const variantSelect = panelsEl.querySelector('#evolveVariantSelect');
    const amountInput = panelsEl.querySelector('#evolveAmountInput');
    const addBtn = panelsEl.querySelector('#addEvolveMaterialBtn');
    const listEl = panelsEl.querySelector('#evolveMaterialList');
    const xpInput = panelsEl.querySelector('#evolveXpInput');
    const levelInput = panelsEl.querySelector('#evolveLevelInput');

    if (materialSelect && variantSelect) materialSelect.addEventListener('change', () => {
      variantSelect.innerHTML = materialVariantOptionsHtml(materialSelect.value);
    });

    if (addBtn && materialSelect && variantSelect) addBtn.addEventListener('click', () => {
      const key = materialSelect.value;
      if (!key) return;
      const variant = variantSelect.value || (MATERIAL_MAP[key].variants[0] || {}).key;
      const amount = amountInput && amountInput.value !== '' ? Number(amountInput.value) : 1;
      f.evolveReq.materials.push({ key, variant, amount: (amount && amount > 0) ? amount : 1 });
      renderFormTabsAndPanels();
    });

    if (listEl) listEl.querySelectorAll('[data-material-remove]').forEach(btn => {
      btn.addEventListener('click', () => {
        f.evolveReq.materials.splice(Number(btn.dataset.materialRemove), 1);
        renderFormTabsAndPanels();
      });
    });

    if (xpInput) xpInput.addEventListener('input', () => { f.evolveReq.xp = xpInput.value; });
    if (levelInput) levelInput.addEventListener('input', () => { f.evolveReq.level = levelInput.value; });
  }

  // Factory shared by the Talents list and the Ultra Talents list — both are the same
  // "click to add a row (icon + name + NP cost)" system, just bound to different fields.
  function makeTalentListController(fieldKey, containerId){
    function list(f){
      if (!Array.isArray(f[fieldKey])) f[fieldKey] = [];
      return f[fieldKey];
    }
    function render(f){
      const el = document.getElementById(containerId);
      if (!el) return;
      el.innerHTML = talentListInnerHtml(list(f));
      bind(el, f);
    }
    async function handleIconUpload(file, f, idx){
      try {
        const dataUrl = await resizeImageFromFile(file, 96, 0.82);
        list(f)[idx].icon = dataUrl;
        render(f);
      } catch(e){
        showToast('Could not load that icon.', 'error');
      }
    }
    function bind(listEl, f){
      const arr = list(f);
      listEl.querySelectorAll('[data-talent-icon-btn]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = btn.dataset.talentIconBtn;
          listEl.querySelector('[data-talent-icon-input="' + idx + '"]').click();
        });
      });
      listEl.querySelectorAll('[data-talent-icon-input]').forEach(inp => {
        inp.addEventListener('change', async () => {
          const idx = Number(inp.dataset.talentIconInput);
          if (inp.files[0]) await handleIconUpload(inp.files[0], f, idx);
        });
      });
      listEl.querySelectorAll('[data-talent-name]').forEach(inp => {
        inp.addEventListener('input', () => { arr[Number(inp.dataset.talentName)].name = inp.value; });
      });
      listEl.querySelectorAll('[data-talent-cost]').forEach(inp => {
        inp.addEventListener('input', () => { arr[Number(inp.dataset.talentCost)].cost = inp.value; });
      });
      listEl.querySelectorAll('[data-talent-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          arr.splice(Number(btn.dataset.talentRemove), 1);
          render(f);
        });
      });
    }
    function addNew(f){
      list(f).push({ icon:null, name:'', cost:'' });
      render(f);
    }
    return { render, bind, addNew };
  }

  const talentController = makeTalentListController('talents', 'talentList');
  const ultraTalentController = makeTalentListController('ultraTalents', 'ultraTalentList');

  function updateLevelPreviewBadges(f){
    if (!levelPreviewOn) return;
    const level = formPreviewLevel(f);
    const baseLevel = formBaseLevel(f, activeFormIndex);
    ['hp', 'ap'].forEach(key => {
      const el = document.querySelector('[data-level-preview="' + key + '"]');
      if (!el) return;
      const growth = Number(key === 'hp' ? f.hpGrowth : f.dmgGrowth) || 0;
      const base = Number(f.stats[key]) || 0;
      const atLevel = base + growth * (level - baseLevel);
      el.textContent = '@ Lvl ' + level + ': ' + formatNum(Math.round(atLevel));
    });
  }

  // Keeps the "Effective dmg" / "Effective HP" small-text under the Damage and HP fields in sync
  // with the current stat values, level preview, and trait effects — without a full re-render.
  function updateEffectivePreviews(f){
    ['hp', 'ap'].forEach(key => {
      const el = document.querySelector('[data-effective-preview="' + key + '"]');
      if (!el) return;
      if (!effectivePreviewOn){ el.hidden = true; return; }
      const level = levelPreviewOn ? formPreviewLevel(f) : formBaseLevel(f, activeFormIndex);
      const baseLevel = formBaseLevel(f, activeFormIndex);
      const growth = Number(key === 'hp' ? f.hpGrowth : f.dmgGrowth) || 0;
      const base = Number(f.stats[key]) || 0;
      const value = levelPreviewOn ? (base + growth * (level - baseLevel)) : base;
      const text = effectivePreviewText(key, f, value);
      el.textContent = text;
      el.hidden = !text;
    });
  }

  function updateDpsDisplay(f){
    const el = document.getElementById('dpsComputedValue');
    const level = currentPreviewLevel(f);
    if (el){
      const cycle = attackCycleOf(f);
      const qualifies = isEffectiveQualified(f);
      if (cycle > 0){
        let val = apAtLevel(f, activeFormIndex, level) / cycle;
        let suffix = '';
        if (effectivePreviewOn && qualifies){ val *= bestDealtMultiplier(f); suffix = '*'; }
        el.textContent = formatDps(val) + suffix;
      } else {
        el.textContent = '—';
      }
    }
    f.stats.dps = attackCycleOf(f) > 0 ? baseDps(f) : '';
  }

  function updateEffectiveHint(f){
    const hint = document.getElementById('effectivePreviewHint');
    if (!hint) return;
    hint.hidden = !effectivePreviewOn;
    hint.textContent = effectiveHintText(f);
  }

  function updateLevelPreviewHint(f){
    const hint = document.getElementById('levelPreviewHint');
    if (hint) hint.textContent = levelPreviewHintText(f);
  }

  function bindFormPanelEvents(panelsEl, f){
    const nameInp = panelsEl.querySelector('input[data-form-name]');
    if (nameInp) nameInp.addEventListener('input', () => {
      f.label = nameInp.value;
      const tabBtn = document.querySelector('.form-tab[data-idx="' + activeFormIndex + '"]');
      if (tabBtn) tabBtn.textContent = formLabelAt(workingCat, activeFormIndex);
      if (activeFormIndex === 0){
        document.getElementById('editTitle').textContent = editingIsNew ? 'New Cat' : ('Edit ' + (nameInp.value.trim() || 'Cat'));

    });
    const targetTypeSelect = panelsEl.querySelector('#targetTypeSelect');
    if (targetTypeSelect) targetTypeSelect.addEventListener('change', () => {
      f.targetType = targetTypeSelect.value;
      renderFormTabsAndPanels();
    });
    const rangeModifierSelect = panelsEl.querySelector('#rangeModifierSelect');
    if (rangeModifierSelect) rangeModifierSelect.addEventListener('change', () => {
      f.rangeModifier = rangeModifierSelect.value;
      renderFormTabsAndPanels();
    });

    panelsEl.querySelectorAll('input[data-stat]').forEach(inp => {
      inp.addEventListener('input', () => {
        f.stats[inp.dataset.stat] = inp.value;
        if (inp.dataset.stat === 'ap' || inp.dataset.stat === 'tba' || inp.dataset.stat === 'animTime') updateDpsDisplay(f);
        if (inp.dataset.stat === 'hp' || inp.dataset.stat === 'ap'){
          updateLevelPreviewBadges(f);
          updateEffectivePreviews(f);
        }
      });
    });
    panelsEl.querySelectorAll('input[data-growth]').forEach(inp => {
      inp.addEventListener('input', () => {
        f[inp.dataset.growth] = inp.value;

    panelsEl.querySelectorAll('textarea[data-text]').forEach(ta => {
      ta.addEventListener('input', () => { f[ta.dataset.text] = ta.value; });
    });

    const levelBtn = panelsEl.querySelector('#levelPreviewBtn');
    if (levelBtn) levelBtn.addEventListener('click', () => {
      levelPreviewOn = !levelPreviewOn;
      renderFormTabsAndPanels();
    });
    const levelInput = panelsEl.querySelector('#levelPreviewInput');
    if (levelInput) levelInput.addEventListener('input', () => {
      const raw = levelInput.value;
      f.previewLevel = raw === '' ? null : Math.max(1, Number(raw) || 1);
      updateLevelPreviewBadges(f);
      updateDpsDisplay(f);
      updateLevelPreviewHint(f);
      updateEffectivePreviews(f);
    });

    const baseLevelInput = panelsEl.querySelector('#baseLevelInput');
    const setBaseLevelBtn = panelsEl.querySelector('#setBaseLevelBtn');
    if (setBaseLevelBtn) setBaseLevelBtn.addEventListener('click', () => {
      const lvl = Math.max(1, Number(baseLevelInput.value) || 1);

      showToast('Base level for ' + (FORM_LABELS[activeFormIndex] || 'this form') + ' set to Level ' + lvl + '.');
      renderFormTabsAndPanels();
    });
    const resetBaseLevelBtn = panelsEl.querySelector('#resetBaseLevelBtn');
    if (resetBaseLevelBtn) resetBaseLevelBtn.addEventListener('click', () => {
      f.baseLevel = null;
      renderFormTabsAndPanels();
    });

    const addTraitBtn = panelsEl.querySelector('#addTraitBtn');
    const traitSelect = panelsEl.querySelector('#strongTraitSelect');
    const traitAbilitySelect = panelsEl.querySelector('#traitAbilitySelect');
    const traitValueFields = panelsEl.querySelector('#traitValueFields');
    function syncTraitValueFields(){
      if (!traitValueFields || !traitAbilitySelect) return;
      const type = TRAIT_ABILITY_MAP[traitAbilitySelect.value];
      traitValueFields.innerHTML = traitValueFieldsHtml(type);
    }
    if (traitAbilitySelect) traitAbilitySelect.addEventListener('change', syncTraitValueFields);
    syncTraitValueFields();

    if (addTraitBtn && traitSelect && traitAbilitySelect) addTraitBtn.addEventListener('click', () => {
      const traits = Array.from(traitSelect.selectedOptions).map(o => o.value).filter(Boolean);
      const ability = traitAbilitySelect.value;
      if (!traits.length || !ability) return;
      const type = TRAIT_ABILITY_MAP[ability];
      const entry = { ability, traits };
      (type.fields || []).forEach(fld => {
        const inp = traitValueFields.querySelector('[data-field-input="' + fld.key + '"]');
        const raw = inp ? inp.value : '';
        const num = Number(raw);
        entry[fld.key] = (raw !== '' && !isNaN(num)) ? num : fld.default;
      });
      f.traitEffects = f.traitEffects || [];
      const entryKey = ability + '|' + traits.slice().sort().join(',');
      const exists = f.traitEffects.some(e => (e.ability + '|' + (e.traits || []).slice().sort().join(',')) === entryKey);
      if (!exists) f.traitEffects.push(entry);
      Array.from(traitSelect.options).forEach(o => { o.selected = false; });
      syncTraitValueFields();
      renderTraitBox(f);
    });
    const traitListEl = panelsEl.querySelector('#traitList');
    if (traitListEl) bindTraitListEvents(traitListEl, f);

    const effectiveBtn = panelsEl.querySelector('#effectivePreviewBtn');
    if (effectiveBtn) effectiveBtn.addEventListener('click', () => {
      effectivePreviewOn = !effectivePreviewOn;
      effectiveBtn.classList.toggle('active', effectivePreviewOn);
      updateEffectiveHint(f);
      updateDpsDisplay(f);
      updateEffectivePreviews(f);
    });

    neutralAbilityController.render(f, panelsEl);

    bindEvolveReqSectionEvents(panelsEl, f, activeFormIndex);

    const immunitySelect = panelsEl.querySelector('#immunitySelect');
    const addImmunityBtn = panelsEl.querySelector('#addImmunityBtn');
    if (addImmunityBtn && immunitySelect) addImmunityBtn.addEventListener('click', () => {
      const key = immunitySelect.value;
      if (!key) return;
      f.immunities = f.immunities || [];
      if (!f.immunities.includes(key)) f.immunities.push(key);
      renderImmunityBox(f, panelsEl);
    });
    const immunityListEl = panelsEl.querySelector('#immunityList');
    if (immunityListEl) bindImmunityListEvents(immunityListEl, f);

    const conjureWrapEl = panelsEl.querySelector('#conjureWrap');
    if (conjureWrapEl) bindConjureSectionEvents(conjureWrapEl, f);

    const talentListEl = panelsEl.querySelector('#talentList');
    if (talentListEl) talentController.bind(talentListEl, f);
    const addTalentBtn = panelsEl.querySelector('#addTalentBtn');
    if (addTalentBtn) addTalentBtn.addEventListener('click', () => talentController.addNew(f));

    const ultraTalentListEl = panelsEl.querySelector('#ultraTalentList');
    if (ultraTalentListEl) ultraTalentController.bind(ultraTalentListEl, f);
    const addUltraTalentBtn = panelsEl.querySelector('#addUltraTalentBtn');
    if (addUltraTalentBtn) addUltraTalentBtn.addEventListener('click', () => ultraTalentController.addNew(f));

    const dropzone = panelsEl.querySelector('#imageDrop');
    const fileInput = panelsEl.querySelector('#imageInput');
    panelsEl.querySelector('#uploadImgBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      if (fileInput.files[0]) await handleImageUpload(fileInput.files[0], f);
    });
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
    dropzone.addEventListener('drop', async e => {
      e.preventDefault();
      dropzone.classList.remove('drag');
      if (e.dataTransfer.files[0]) await handleImageUpload(e.dataTransfer.files[0], f);
    });

    const removeBtn = panelsEl.querySelector('#removeImgBtn');
    if (removeBtn) removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      f.image = null;
      renderFormTabsAndPanels();
    });
  }

  async function handleImageUpload(file, f){
    try {
      const dataUrl = await resizeImageFromFile(file, 360, 0.85);
      f.image = dataUrl;
      renderFormTabsAndPanels();
    } catch(e){
      showToast('Could not load that image.', 'error');
    }
  }

  // Wraps a promise so it can never hang forever — if it doesn't settle within
  // `ms`, we reject explicitly instead of leaving the UI stuck on "Saving…"
  // with no feedback at all.
  function withTimeout(promise, ms, label){
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error((label || 'Operation') + ' timed out after ' + ms + 'ms')), ms);
      promise.then(
        v => { clearTimeout(timer); resolve(v); },
        e => { clearTimeout(timer); reject(e); }
      );
    });
  }

  async function saveWorkingCat(){
    const firstFormName = (workingCat.forms[0] && workingCat.forms[0].label || '').trim();
    if (!firstFormName){
      showToast('Give Form 1 a name first.', 'error');
      activeFormIndex = 0;
      renderFormTabsAndPanels();
      const nameInp = document.querySelector('input[data-form-name]');
      if (nameInp) nameInp.focus();
      return;
    }

    if (!localStorageAvailable()){
      showToast('Your browser is blocking local storage (e.g. private/incognito mode) so cats can\u2019t be saved here.', 'error');
      return;
    }

    workingCat.name = firstFormName;

    workingCat.forms.forEach((f, i) => {
      f.label = (f.label || '').trim() || FORM_LABELS[i] || ('Form ' + (i + 1));
      STAT_FIELDS.forEach(sf => {
        const v = f.stats[sf.key];
        f.stats[sf.key] = (v === '' || v === null || v === undefined) ? 0 : Number(v);
      });
      EXTRA_RANGE_STAT_KEYS.forEach(key => {
        const v = f.stats[key];
        f.stats[key] = (v === '' || v === null || v === undefined) ? 0 : Number(v);
      });
      if (!TARGET_TYPE_MAP[f.targetType]) f.targetType = 'single';
      if (!RANGE_MODIFIER_MAP[f.rangeModifier]) f.rangeModifier = 'none';
      f.hpGrowth = (f.hpGrowth === '' || f.hpGrowth == null) ? 0 : Number(f.hpGrowth);
      f.dmgGrowth = (f.dmgGrowth === '' || f.dmgGrowth == null) ? 0 : Number(f.dmgGrowth);
      f.description = (f.description || '').trim() || 'None';
      if (!Array.isArray(f.abilities)) f.abilities = [];
      if (!Array.isArray(f.immunities)) f.immunities = [];
      if (!f.conjure || typeof f.conjure !== 'object') f.conjure = { name:'', damage:'', abilities:[] };
      if (!Array.isArray(f.conjure.abilities)) f.conjure.abilities = [];
      f.conjure.name = (f.conjure.name || '').trim();
      f.conjure.damage = (f.conjure.damage === '' || f.conjure.damage == null) ? '' : Number(f.conjure.damage);
      if (!Array.isArray(f.talents)) f.talents = [];
      if (!Array.isArray(f.ultraTalents)) f.ultraTalents = [];
      if (!Array.isArray(f.traitEffects)) f.traitEffects = [];
      f.previewLevel = (f.previewLevel === '' || f.previewLevel == null) ? null : Math.max(1, Number(f.previewLevel) || 1);
      f.baseLevel = (f.baseLevel === '' || f.baseLevel == null) ? null : Math.max(1, Number(f.baseLevel) || 1);

      if (!f.evolveReq || typeof f.evolveReq !== 'object') f.evolveReq = { materials: [], xp: '' };
      if (!Array.isArray(f.evolveReq.materials)) f.evolveReq.materials = [];
      f.evolveReq.materials = f.evolveReq.materials
        .filter(e => e && MATERIAL_MAP[e.key])
        .map(e => ({ key: e.key, variant: e.variant, amount: (e.amount === '' || e.amount == null) ? 0 : Number(e.amount) }));
      f.evolveReq.xp = (f.evolveReq.materials.length && f.evolveReq.xp !== '' && f.evolveReq.xp != null) ? Number(f.evolveReq.xp) : '';
      f.evolveReq.level = (f.evolveReq.level === '' || f.evolveReq.level == null) ? '' : Math.max(1, Number(f.evolveReq.level) || 1);
    });

    // Ultra Forms always need evolve requirements — they have no default "reach a level"
    // fallback the way Evolved (→ Lvl 10) and True (→ Lvl 30) do, so block the save here
    // rather than silently saving an Ultra Form nobody can actually reach.
    const ultraForm = workingCat.forms[3];
    if (workingCat.formCount >= 4 && ultraForm && (!ultraForm.evolveReq.materials || !ultraForm.evolveReq.materials.length)){
      showToast('Ultra Forms always need at least one evolve material — add one on the Ultra tab.', 'error');
      activeFormIndex = 3;
      renderFormTabsAndPanels();
      return;
    }

    if (!workingCat.id) workingCat.id = uid();

    const saveBtn = document.getElementById('saveCatBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    try {
      await withTimeout(persistCat(workingCat), 10000, 'Saving cat');

      // Thumbnail generation is a nice-to-have, not a requirement for saving —
      // never let a failure here (e.g. a bad image) block the cat from being
      // added to the list. Fall back to no thumbnail instead of aborting.
      let thumb = null;
      if (workingCat.forms[0] && workingCat.forms[0].image){
        try { thumb = await withTimeout(resizeDataUrl(workingCat.forms[0].image, 110, 0.75), 8000, 'Thumbnail'); }
        catch(thumbErr){ thumb = null; }
      }

      const summary = { id: workingCat.id, name: workingCat.name, rarity: workingCat.rarity, bannerId: workingCat.bannerId || MY_BANNER_ID, formCount: workingCat.formCount, thumb };
      const existingIdx = indexCache.findIndex(c => c.id === workingCat.id);
      if (existingIdx >= 0) indexCache[existingIdx] = summary; else indexCache.push(summary);
      await withTimeout(persistIndex(), 10000, 'Saving cat list');

      // Re-fetch the index straight from storage rather than trusting the
      // in-memory copy, so the list view always reflects what's actually saved.
      indexCache = await fetchIndex();

      showToast(workingCat.name + ' saved!');
      showView('list');
    } catch(err){
      // Log the real error so it's visible in devtools for diagnosis, and
      // surface a bit of detail in the toast instead of a fully generic message.
      console.error('Whisker Works save failed:', err);
      const detail = (err && err.message) ? (': ' + String(err.message).slice(0, 120)) : '';
      showToast('Something went wrong saving' + detail, 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Cat';
    }
  }

  /* ============================= Wiring ============================= */

  document.querySelectorAll('.tab-btn[data-view]').forEach(b => b.addEventListener('click', () => showView(b.dataset.view)));
  document.getElementById('newCatBtn').addEventListener('click', () => openEditor(null));
  document.getElementById('newBannerBtn').addEventListener('click', () => openCreateBannerModal(null));
  document.getElementById('backToList').addEventListener('click', () => showView('list'));
  document.getElementById('addToCompareBtn').addEventListener('click', openComparePickerModal);
  document.getElementById('compareEffectiveBtn').addEventListener('click', () => {
    compareEffectiveOn = !compareEffectiveOn;
    document.getElementById('compareEffectiveBtn').classList.toggle('active', compareEffectiveOn);
    renderCompare();
  });

  document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value; renderList(); });
  document.getElementById('rarityFilterSelect').addEventListener('change', e => { rarityFilter = e.target.value; renderList(); });
  document.getElementById('bannerFilterSelect').addEventListener('change', e => { bannerFilter = e.target.value; renderList(); });

  document.getElementById('catGrid').addEventListener('click', e => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id, action = btn.dataset.action;
    if (action === 'edit') openEditor(id);
    else if (action === 'delete') confirmDeleteCat(id);
    else if (action === 'toggle-compare') toggleCompareSelection(id, true);
    else if (action === 'export') exportSingleCat(id);
  });

  document.getElementById('deleteCatBtn').addEventListener('click', () => { if (workingCat.id) confirmDeleteCat(workingCat.id); });

  document.getElementById('catForm').addEventListener('submit', e => {
    e.preventDefault();
    saveWorkingCat();
  });

  /* ---- Export / Import wiring ---- */

  document.getElementById('exportAllBtn').addEventListener('click', exportAll);
  document.getElementById('importAllBtn').addEventListener('click', () => document.getElementById('importAllInput').click());
  document.getElementById('importCatBtn').addEventListener('click', () => document.getElementById('importCatInput').click());
  document.getElementById('exportBannerBtn').addEventListener('click', () => exportBanner(bannerFilter));
  document.getElementById('importBannerBtn').addEventListener('click', () => document.getElementById('importBannerInput').click());

  [['importAllInput'], ['importCatInput'], ['importBannerInput']].forEach(([inputId]) => {
    const inp = document.getElementById(inputId);
    inp.addEventListener('change', async () => {
      const file = inp.files && inp.files[0];
      inp.value = ''; // allow re-selecting the same file next time
      if (file) await handleImportFile(file);
    });
  });

  /* ============================= Banners ============================= */

  function renderBannerFilterSelect(){
    const el = document.getElementById('bannerFilterSelect');
    const current = bannerFilter;
    el.innerHTML = '<option value="all">All banners</option>' +
      bannersCache.map(b => '<option value="' + b.id + '">' + esc(b.name) + '</option>').join('');
    el.value = bannersCache.some(b => b.id === current) || current === 'all' ? current : 'all';
  }

  function openCreateBannerModal(onCreated){
    let nameValue = '';
    openModal({
      title: 'Create banner',
      body: '<label class="text-field"><span>Banner name</span><input type="text" id="newBannerNameInput" class="input" style="width:100%" placeholder="e.g. Uber Rare Vault"></label>',
      confirmLabel: 'Create',
      onConfirm: async () => {
        const name = nameValue.trim() || 'Untitled Banner';
        const banner = { id: uid('banner'), name: name };
        bannersCache.push(banner);
        await persistBanners();
        renderBannerFilterSelect();
        showToast(banner.name + ' banner created!');
        if (onCreated) onCreated(banner.id);
      }
    });
    const inp = document.getElementById('newBannerNameInput');
    if (inp){
      inp.addEventListener('input', () => { nameValue = inp.value; });
      inp.focus();
    }
  }

  /* ============================= Init ============================= */

  async function init(){
    bannersCache = await fetchBanners();
    renderBannerFilterSelect();
    indexCache = await fetchIndex();
    renderList();
    updateCompareTabBadge();
  }

  init();
})();
</script>
